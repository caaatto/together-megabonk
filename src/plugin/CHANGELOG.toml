# MegabonkTogether Changelog
# Format:
# [version."X.Y.Z"]
# changes = [
#     "Change 1 description",
#     "Change 2 description",
# ]

[version."5.2.0"]
changes = [
    "Fixed the permanent soft lock on 'Waiting for other player(s) choices...'. Confirmations are now counted per player instead of collected in a set that got cleared after every encounter, so a late confirmation or one sent by a dead player can no longer close an encounter somebody is still choosing in.",
    "Added a host side failsafe: if an encounter stays open too long the host closes it for everyone, so a lost packet cannot end the run. Tunable with EncounterFailsafeTimeoutSeconds in the config, default 60 seconds, 0 disables it.",
    "Fixed the soft lock when opening a second chest. The chest window kept a null open button around, which crashed the game code on the next chest.",
    "Fixed enemies walking off towards nothing. Target switching crashed whenever a player was not spawned yet, already gone, or dead, and the crash made it retry on every single frame for every enemy.",
    "Fixed a case where a player silently stopped sending any network message for the rest of the run after an error while applying a received one.",
    "Fixed shrine, pylon and boss lamp charging crashing when you left the trigger without a matching start, for example after a level change.",
    "Fixed kill counts and progression drifting apart between players over a long session.",
    "Reduced wasted work in the per enemy interpolation when the host falls behind, which is when the frame rate used to collapse.",
    "Fixed being stuck forever on the \"Waiting for other players\" screen when loading a map. The wait needed at least two players to ever finish, so if everybody else dropped during the load the game stayed paused on that screen with no way out but restarting. It now notices that everyone left, and gives up after LobbyReadyTimeoutSeconds (45 by default) instead of waiting forever.",
    "Fixed the graveyard final boss keeping its shield for guests. Lamps going on and out is now decided by the host, so every player counts the same number of lit lamps and sees the same boss armor.",
    "The host now keeps everyone on the same run, stage, swarm, difficulty and crypt clock. They used to drift apart because a shared experience pause lasts a different amount of time for each player, so one player could be at 00:00 with the final swarm while another still had minutes left. Can be turned off with SynchronizeTimers.",
]

[version."5.1.0"]
changes = [
    "More code optimization! this wil help for more stable FPS"
]

[version."5.0.0"]
changes = [
    "Added Proton support: You can now play with your friends on Steam using Proton/SteamDeck (Cross playable on windows) . Please note that this is also an experimental feature and might not work perfectly."
]

[version."4.2.2"]
changes = [
    "Attempt to fix FPS issues: Less critical update are now sent unreliably, which improves bandwidth and CPU usage",
    "Attempt to fix some desync issues (Shared Experience): Some packets were dropped in some scenarios. Critical interactions are now sent reliably, which should prevent the desync issues.",
]

[version."4.2.1"]
changes = [
    "Reworked damage calculation: Some items/projectiles were not applying damage correctly. This is now globally resolved (some items still have issues, will try to fix later)",
]

[version."4.2.0"]
changes = [
    "More code optimizations again !",
    "Some items fixes : Prevent Soul Harvester / Chaos tome triggering even when not owned"
]

[version."4.1.0"]
changes = [
    "More improvements to tackle FPS issues"
]


[version."4.0.3"]
changes = [
    "Fixed Gold desync (Shared Experience): Gold sharing has been reworked a bit. All gains are now shared across everyone, while losses are applied individually. Players who can't afford a chest will be paused until eligible players finish"
]

[version."4.0.2"]
changes = [
    "Attempt to fix gold desync (Shared Experience): Computing delta instead of raw changes"
]

[version."4.0.1"]
changes = [
    "Attempt to fix encounter desync (Shared Experience): Better handling of multiple encounters occurring at the same time. It should prevent deadlocks (though laggy players might still cause issues). This fix should at least help for now."
]

[version."4.0.0"]
changes = [
    "Added a new <color=#FFD700><size=32><b>(Experimental!)</b></size></color> <b>Shared Experience</b> mode! Shared XP,Gold and interactions across all players. This also imply an active <b>Pause</b> on every interactions. The original mode is still available",
    "Added a 'Netplay options' button that now gather all netplay related options (Shared Experience and Save progression)",
    "Fixed some boss not rendering sometimes for some reason"
]

[version."3.0.0"]
changes = [
    "Added a distance throttler for enemies (they will not update / be rendered when too far away), same idea for projectile (reduced opacity for far away projectile). This in theory should help improve FPS",
    "Rebalanced Reviver to make them less punishing early (start at low health and increase per player per death)"
]

[version."2.0.2"]
changes = [
    "Fixed item Ghost crashing : This was the main reason everyone was crashing. (Note: There might be other items causing issues, please report them if you find any at https://github.com/Fcornaire/megabonk-together/issues)",
    "Added egg interaction support",
    "Fixed client side Challenge shrines interactions not working properly"
]

[version."2.0.1"]
changes = [
    "Properly queue encounter reward: This should prevent missing rewards when multiples encounters (Level Up, Shrines, Chest,...) happen at the same time. This should also fix the random crash some people where having as i believe it's related to the same issue. Please open an issue at https://github.com/Fcornaire/megabonk-together/issues if you still encounter this problem with the crash logs as i'm having a hard time replicating it.",
    "Added option to allow saving progression in netplay sessions. Use at your own risk",
    "Properly track kills/money per player",
    "Fixed disconnection issues preventing reconnection",
    "Fixed (i hope) button selection reset issue in character window",
    "Fixed projectile not despawning in singleplayer mode",
    "Fixed some connection issues in relay mode for some users"
]

[version."2.0.0"]
changes = [
    "Added changelog system: See what's new after each update!",
    "Implemented Friendlies: A private queue system. One host share a code and other join with it.",
